<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F2F2F2"/><g transform="translate(70,40) scale(0.22)"><g><path d="M 318 686 L 224 866 L 470 718 Z" fill="#141414" stroke="#141414" stroke-width="34" stroke-linejoin="round"/><rect x="132" y="180" width="760" height="560" rx="230" fill="#141414"/><path d="M 327.6 451.5 A 60 60 0 0 1 440.4 451.5" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/><path d="M 583.6 451.5 A 60 60 0 0 1 696.4 451.5" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/></g></g><text x="320" y="190" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="700" font-size="84" fill="#141414" text-anchor="start">snap.</text><text x="100" y="350" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="700" font-size="52" fill="#141414" text-anchor="start">every accountability app</text><text x="100" y="416" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="700" font-size="52" fill="#141414" text-anchor="start">takes your word for it.</text><text x="100" y="506" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="700" font-size="52" fill="#141414" text-anchor="start">snap wants the picture,</text><text x="100" y="572" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="700" font-size="52" fill="#141414" text-anchor="start">and it knows a screenshot.</text><text x="100" y="700" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="500" font-size="34" fill="#6B6B6B" text-anchor="start">the pic is the referee &#183; 0.05 SOL on the line</text><rect x="900" y="120" width="138" height="96" rx="48" fill="#141414"/><text x="938" y="182" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="500" font-size="40" fill="#FFFFFF" text-anchor="start">bro</text><rect x="900" y="232" width="440" height="96" rx="48" fill="#141414"/><text x="938" y="294" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="500" font-size="40" fill="#FFFFFF" text-anchor="start">7:24 and no pic yet</text><rect x="1340" y="344" width="180" height="130" rx="28" fill="#E4E4E4"/><rect x="1370" y="374" width="120" height="14" rx="7" fill="#B9B9B9"/><rect x="1370" y="404" width="120" height="14" rx="7" fill="#B9B9B9"/><rect x="1370" y="434" width="72" height="14" rx="7" fill="#B9B9B9"/><rect x="900" y="490" width="620" height="96" rx="48" fill="#141414"/><text x="938" y="552" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="500" font-size="40" fill="#FFFFFF" text-anchor="start">nice try. thats a screenshot</text><rect x="1340" y="602" width="180" height="130" rx="28" fill="#E4E4E4"/><rect x="1390" y="662" width="80" height="10" rx="5" fill="#141414"/><rect x="1374" y="645" width="14" height="44" rx="4" fill="#141414"/><rect x="1472" y="645" width="14" height="44" rx="4" fill="#141414"/><rect x="1360" y="653" width="10" height="28" rx="3" fill="#141414"/><rect x="1490" y="653" width="10" height="28" rx="3" fill="#141414"/><rect x="900" y="748" width="536" height="96" rx="48" fill="#141414"/><text x="938" y="810" font-family="SF Pro Display, -apple-system, Helvetica Neue, Liberation Sans, Arial, sans-serif" font-weight="500" font-size="40" fill="#FFFFFF" text-anchor="start">0.05 back. thats my guy</text></svg>
