name: Deploy Ranked to GitHub Pages

on:
  push:
    branches: [main, claude/amazing-babbage-hveamd]
    paths: ['ranked/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Requires Settings > Pages > Source = "GitHub Actions" (admin-only, one time).
      # The enablement flag cannot do it: creating a Pages site is not available
      # to the Actions token.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ranked
      - id: deploy
        uses: actions/deploy-pages@v4
