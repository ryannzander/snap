name: Snap
options:
  bundleIdPrefix: com.ryanzander
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Snap:
    type: application
    platform: iOS
    sources: [Snap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanzander.snap
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Snap/Info.plist
      properties:
        CFBundleDisplayName: Snap
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        UIBackgroundModes: [processing]
        NSHealthShareUsageDescription: Snap reads your workouts so it knows whether you actually went.
        NSHealthUpdateUsageDescription: Snap can save a test workout from its debug panel.
    entitlements:
      path: Snap/Snap.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
  SnapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SnapTests]
    dependencies:
      - target: Snap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanzander.snap.tests
schemes:
  Snap:
    build:
      targets:
        Snap: all
        SnapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnapTests
